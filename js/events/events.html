<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <script>
        function loadPage(){
            console.log("Página cargada");
        }
        function btnClk(){
            console.log("Botón clicado");
        }
        function pClk(){
            console.log("Párrafo clicado");
        }
        function pOver(){
            console.log("EL ratón paso por encima");
        }
        function pressed(e){
            console.log(e.key);
        }
        // function pressed(e){
        //     console.log(e.target);
        // }
        function btnEvent(e){
            console.log(e.target);
        }
        function change(){
            console.log("Cambio detectado");
        }
        function writing(){
            console.log("Escribiendo");
        }

 
    </script>


</head>
<body onload="loadPage()">
    <nav><a href="../index.html">← Volver atrás</a><div>Pulsar F12 para abrir las herramientas de desarrollo</div></nav>
    <button onclicK="btnClk()"> Click me!</button>
    <p onclick="btnClk()">Hola</p>
    <p style="border: 1px solid black" onclick="pClk()">Hola</p>
    <p style="border: 1px solid black" onmouseover="pOver()">Hola</p>
    <input onkeypress="pressed(event)">
    <button id="idBoton" data-id="info" onclicK="btnEvent(event)"> Check event!</button>
    <input onchange="change()" oninput="writing()">

</body>
</html>
