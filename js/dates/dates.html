<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dates</title>
    <script>
        let date = new Date();
        console.log(date);
        let customDate = new Date("2003-05-29");
        console.log(customDate);
        let fullDate = new Date(1990, 11, 20, 18,0,3);   //los meses se cuentan de 0 a 11
        console.log(fullDate);
        console.log(fullDate.getDay());  //getDay es el día de la semana 4=Jueves, GetDate te da el dia del mes
        console.log(fullDate.toLocaleString());
    </script>
</head>
