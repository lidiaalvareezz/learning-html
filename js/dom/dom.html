<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificación del Árbol DOM</title>
    <script>
        function addTask(){
            let input = document.getElementById("inputBox");
            console.log(input.value); //para q se guarde el valor
            let li = document.createElement("li") //para crear un elemento nuevo en el arbol
            li.innerHTML = input.value
            // console.log(li)

            //para recuperar el que pone tasK:
            document.getElementById("task").appendChild(li)
            input.value = '';
        }
        //para borrar:
        function deleteMe(e){
            console.log(e.parentNode);
            e.parentNode.remove();
        }
    </script>


</head>
<body>
    <nav><a href="../index.html">← Volver atrás</a><div>Pulsar F12 para abrir las herramientas de desarrollo</div></nav>
    <input name ="task" type="text" id="inputBox">
    <button onclick="addTask()">Añadir tarea</button>
    <ul id="task">

    </ul>
    <button id ="deleteBtn" onclick="deleteMe(this)">Hago magia y desaparezco PARA SIEMPRE</button>
    
</body>
</html>
